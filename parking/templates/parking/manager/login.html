{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang nhap quan tri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'parking/manager.css' %}">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>Quan tri bai do xe</h1>
        <p>Dang nhap tai khoan co quyen quan tri.</p>

        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Ten dang nhap</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Mat khau</label>
                {{ form.password }}
            </div>
            <button class="btn btn-manager w-100" type="submit">Dang nhap</button>
        </form>
    </div>
</body>
</html>
