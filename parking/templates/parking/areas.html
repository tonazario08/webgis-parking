{% extends 'parking/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-info"><i class="fas fa-city me-2"></i>Khu vực hoạt động</h3>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Quay lại Dashboard
    </a>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card card-custom bg-white border-0 shadow-sm p-3 h-100">
            <div class="d-flex align-items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/7169/7169976.png" width="60" class="me-3">
                <div class="flex-grow-1">
                    <h5 class="fw-bold text-dark mb-1">Quận 1, TP.HCM</h5>
                    <p class="text-muted small mb-2">Trung tâm thành phố</p>
                    <div class="d-flex justify-content-between">
                        <span class="badge bg-primary bg-opacity-10 text-primary">8 Bãi xe</span>
                        <span class="badge bg-success bg-opacity-10 text-success">Đang hoạt động</span>
                    </div>
                </div>
                <a href="{% url 'parking_list' %}" class="btn btn-sm btn-outline-info ms-3"><i class="fas fa-eye"></i></a>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card card-custom bg-white border-0 shadow-sm p-3 h-100">
            <div class="d-flex align-items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/7169/7169954.png" width="60" class="me-3">
                <div class="flex-grow-1">
                    <h5 class="fw-bold text-dark mb-1">TP. Thủ Đức</h5>
                    <p class="text-muted small mb-2">Khu công nghệ cao</p>
                    <div class="d-flex justify-content-between">
                        <span class="badge bg-primary bg-opacity-10 text-primary">3 Bãi xe</span>
                        <span class="badge bg-success bg-opacity-10 text-success">Đang hoạt động</span>
                    </div>
                </div>
                <a href="{% url 'parking_list' %}" class="btn btn-sm btn-outline-info ms-3"><i class="fas fa-eye"></i></a>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card card-custom bg-white border-0 shadow-sm p-3 h-100">
            <div class="d-flex align-items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2043/2043449.png" width="60" class="me-3">
                <div class="flex-grow-1">
                    <h5 class="fw-bold text-dark mb-1">Quận 7, TP.HCM</h5>
                    <p class="text-muted small mb-2">Khu đô thị mới</p>
                    <div class="d-flex justify-content-between">
                        <span class="badge bg-primary bg-opacity-10 text-primary">1 Bãi xe</span>
                        <span class="badge bg-warning bg-opacity-10 text-warning">Bảo trì</span>
                    </div>
                </div>
                <a href="{% url 'parking_list' %}" class="btn btn-sm btn-outline-info ms-3"><i class="fas fa-eye"></i></a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
