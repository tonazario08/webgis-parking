<tbody>
{% for p in parking_lots %}
<tr>
    <td>
        <strong>{{ p.name }}</strong><br>
        <small class="text-success">
            <i class="fas fa-parking"></i> {{ p.area.name }}
        </small>
    </td>
    <td>{{ p.address }}</td>
    <td>
        <span class="badge bg-success">Đang mở</span>
    </td>
    <td>
        <strong class="text-success">
            {{ p.available_slots }} / {{ p.capacity }}
        </strong>
        <div class="text-muted small">
            {% if p.available_slots > p.capacity|divisibleby:2 %}
                Còn trống nhiều
            {% else %}
                Sắp đầy
            {% endif %}
        </div>
    </td>
    <td>
        <a href="#" class="btn btn-primary btn-sm">
            <i class="fas fa-location-arrow"></i> Chỉ đường
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="5" class="text-center text-muted">
        Không có bãi đỗ nào còn trống
    </td>
</tr>
{% endfor %}
</tbody>
