{% extends 'parking/base.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark">
        <i class="fas fa-globe-asia text-primary me-2"></i>Bản đồ số Việt Nam
    </h3>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Quay lại Dashboard
    </a>
</div>

<div class="card card-custom p-2 bg-white shadow-sm">
    <div id="map" style="height: 75vh; width: 100%; border-radius: 8px;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Khởi tạo bản đồ (zoom tạm, sẽ fitBounds sau)
    var map = L.map('map').setView([16.0, 106.0], 6);

    // 2. Layer nền
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 3. Group marker để auto zoom
    var markers = L.featureGroup().addTo(map);

    // 4. Marker từ database (Django render)
    {% for area in areas %}
        {% if area.latitude and area.longitude %}
            L.marker([{{ area.latitude }}, {{ area.longitude }}])
                .addTo(markers)
                .bindPopup(`
                    <b>{{ area.name }}</b><br>
                    {{ area.description|default:"Không có mô tả" }}
                `);
        {% endif %}
    {% endfor %}

    // 5. Auto zoom nếu có marker
    if (markers.getLayers().length > 0) {
        map.fitBounds(markers.getBounds(), { padding: [50, 50] });
    }
</script>
{% endblock %}
