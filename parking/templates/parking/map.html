{% extends 'parking/base.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.css" />

<style>
    .map-page { display: grid; grid-template-columns: 340px 1fr; gap: 1rem; }
    .map-panel { background: #fff; border: 1px solid #d7e2dc; border-radius: 14px; padding: 1rem; box-shadow: 0 8px 18px rgba(16, 33, 36, 0.08); height: 78vh; overflow: auto; }
    .map-box { background: #fff; border: 1px solid #d7e2dc; border-radius: 14px; padding: .5rem; box-shadow: 0 8px 18px rgba(16, 33, 36, 0.08); }
    #map { height: 76vh; width: 100%; border-radius: 10px; }

    .ctl-title { font-size: 1rem; font-weight: 800; margin-bottom: .35rem; }
    .ctl-sub { font-size: .87rem; color: #607173; margin-bottom: .9rem; }
    .status { background: #eef6f3; border: 1px dashed #c6dbd2; border-radius: 10px; padding: .6rem .7rem; font-size: .9rem; margin-bottom: .9rem; }

    .route-box { border: 1px solid #d7e2dc; border-radius: 10px; padding: .7rem; margin-bottom: .9rem; }
    .route-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
    .route-grid input { border: 1px solid #cfdcd6; border-radius: 8px; padding: .45rem .55rem; font-size: .88rem; }
    .route-address { display: grid; gap: .45rem; margin-top: .6rem; }

    .parking-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
    .parking-item { border: 1px solid #e3ebe6; border-radius: 10px; padding: .6rem; cursor: pointer; }
    .parking-item:hover { border-color: #8fb9aa; background: #f4faf8; }

    .badge-ok, .badge-full { border-radius: 999px; padding: .1rem .55rem; font-size: .75rem; font-weight: 700; }
    .badge-ok { color: #0c7a40; background: #d8f3df; }
    .badge-full { color: #b42318; background: #fee4e2; }

    .map-legend, .map-info { background: #fff; border: 1px solid #d7e2dc; border-radius: 10px; padding: .55rem .6rem; box-shadow: 0 8px 18px rgba(16, 33, 36, 0.08); font-size: .78rem; color: #405557; }
    .map-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .map-info strong { display: block; font-size: .8rem; margin-bottom: .2rem; }

    .map-btn { background: #fff; border: 1px solid #d7e2dc; border-radius: 8px; padding: .35rem .5rem; box-shadow: 0 6px 14px rgba(16, 33, 36, 0.12); cursor: pointer; }
    .map-btn:hover { background: #f4faf8; }

    @media (max-width: 992px) {
        .map-page { grid-template-columns: 1fr; }
        .map-panel { height: auto; }
        #map { height: 62vh; }
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0"><i class="fas fa-map-location-dot text-primary me-2"></i>Ban do bai do xe</h4>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Ve Dashboard</a>
</div>

<div class="map-page">
    <aside class="map-panel">
        <div class="ctl-title">Dieu khien ban do</div>
        <div class="ctl-sub">Nhap vi do/kinh do bat ky, tim bai do gan nhat va ve lo trinh ngan nhat theo du lieu duong thuc te.</div>

        <div id="statusBox" class="status">San sang tai du lieu ban do...</div>

        <div class="route-box">
            <div class="ctl-title mb-2">Nhap toa do cua ban</div>
            <div class="route-grid mb-2">
                <input id="originLat" type="number" step="any" placeholder="Vi do (lat)">
                <input id="originLon" type="number" step="any" placeholder="Kinh do (lon)">
            </div>
            <div class="route-address">
                <input id="originAddress" type="text" placeholder="Nhap dia chi cua ban (1 dong)">
                <div class="d-flex gap-2">
                    <button id="btnGeocodeAddress" class="btn btn-sm btn-outline-primary" type="button">Kiem tra dia chi</button>
                    <button id="btnClearAddress" class="btn btn-sm btn-outline-secondary" type="button">Xoa dia chi</button>
                </div>
                <div id="addressSuggestions" class="list-group" style="z-index: 5;"></div>
            </div>
            <div class="d-grid gap-2 mt-2">
                <button id="btnApplyCoord" class="btn btn-sm btn-primary">Dong y toa do</button>
                <button id="btnLocate" class="btn btn-sm btn-outline-primary">Lay vi tri hien tai</button>
            </div>
        </div>

        <div class="d-grid gap-2 mb-3">
            <button id="btnNearest" class="btn btn-success btn-sm"><i class="fas fa-compass me-1"></i>Tim bai gan nhat</button>
            <button id="btnRouteNearest" class="btn btn-warning btn-sm"><i class="fas fa-route me-1"></i>Chi duong den bai gan nhat</button>
            <button id="btnReset" class="btn btn-outline-secondary btn-sm"><i class="fas fa-rotate-left me-1"></i>Dat lai ban do</button>
        </div>

        <div class="ctl-title">Danh sach bai do</div>
        <ul id="parkingList" class="parking-list"></ul>
    </aside>

    <section class="map-box">
        <div id="map"></div>
    </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
<script src="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js"></script>
<script>
    const defaultView = { lat: 10.7769, lng: 106.7009, zoom: 12 };
    const maxBounds = L.latLngBounds([7.5, 102.0], [23.7, 110.5]);

    const map = L.map('map', {
        zoomControl: true,
        maxBounds: maxBounds,
        maxBoundsViscosity: 0.85,
        fullscreenControl: true,
    }).setView([defaultView.lat, defaultView.lng], defaultView.zoom);

    const baseLayers = {
        "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '(c) OpenStreetMap contributors'
        }),
        "OSM Humanitarian": L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '(c) OpenStreetMap contributors, HOT'
        }),
        "Esri Imagery": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles (c) Esri'
        })
    };
    baseLayers["OpenStreetMap"].addTo(map);

    const availableCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 52 });
    const fullCluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 52 });
    const routeLayer = L.layerGroup().addTo(map);

    const overlayLayers = {
        "Bai con cho": availableCluster,
        "Bai da day": fullCluster,
        "Lo trinh": routeLayer,
    };
    availableCluster.addTo(map);
    fullCluster.addTo(map);

    L.control.layers(baseLayers, overlayLayers, { position: 'topright' }).addTo(map);
    L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);

    const miniLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    new L.Control.MiniMap(miniLayer, { toggleDisplay: true, minimized: true, position: 'bottomright' }).addTo(map);

    const mapInfo = L.control({ position: 'bottomleft' });
    mapInfo.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-info');
        div.id = 'mapInfoBox';
        return div;
    };
    mapInfo.addTo(map);

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'map-legend');
        div.innerHTML = `
            <div><span class="dot" style="background:#16a34a"></span>Con cho</div>
            <div><span class="dot" style="background:#dc2626"></span>Da day</div>
        `;
        return div;
    };
    legend.addTo(map);

    const homeControl = L.control({ position: 'topleft' });
    homeControl.onAdd = function () {
        const btn = L.DomUtil.create('button', 'map-btn');
        btn.type = 'button';
        btn.title = 'Ve tam mac dinh';
        btn.innerHTML = '<i class="fas fa-house"></i>';
        L.DomEvent.disableClickPropagation(btn);
        L.DomEvent.on(btn, 'click', (e) => {
            L.DomEvent.preventDefault(e);
            resetMap();
        });
        return btn;
    };
    homeControl.addTo(map);

    const state = {
        parkings: [],
        markers: new Map(),
        origin: null,
        originMarker: null,
        nearest: null,
        nearestMarker: null,
        routeLine: null,
    };

    const parkingListEl = document.getElementById('parkingList');
    const statusBox = document.getElementById('statusBox');
    const originLatEl = document.getElementById('originLat');
    const originLonEl = document.getElementById('originLon');
    const originAddressEl = document.getElementById('originAddress');
    const addressSuggestionsEl = document.getElementById('addressSuggestions');
    const btnGeocodeAddress = document.getElementById('btnGeocodeAddress');
    const btnClearAddress = document.getElementById('btnClearAddress');
    let suggestionTimer = null;

    function setStatus(text) {
        statusBox.textContent = text;
    }

    function updateMapInfo() {
        const center = map.getCenter();
        const bounds = map.getBounds();
        const infoEl = document.getElementById('mapInfoBox');
        if (!infoEl) return;
        infoEl.innerHTML = `
            <strong>Thong tin khung nhin</strong>
            Center: ${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}<br>
            Bounds: ${bounds.getSouthWest().lat.toFixed(4)}, ${bounds.getSouthWest().lng.toFixed(4)} -> ${bounds.getNorthEast().lat.toFixed(4)}, ${bounds.getNorthEast().lng.toFixed(4)}<br>
            Zoom: ${map.getZoom()}
        `;
    }

    map.on('moveend zoomend', updateMapInfo);
    updateMapInfo();

    function clearRoute() {
        if (state.routeLine) {
            routeLayer.removeLayer(state.routeLine);
            state.routeLine = null;
        }
    }

    function iconByAvailability(availableSlots) {
        const color = availableSlots > 0 ? '#16a34a' : '#dc2626';
        return L.divIcon({
            html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 0 2px ${color}55"></div>`,
            className: '',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
        });
    }

    function validateCoordinate(lat, lon) {
        return Number.isFinite(lat) && Number.isFinite(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180;
    }

    function bindOriginDrag(marker) {
        marker.on('dragend', async () => {
            const pos = marker.getLatLng();
            state.origin = { lat: pos.lat, lon: pos.lng };
            originLatEl.value = pos.lat.toFixed(6);
            originLonEl.value = pos.lng.toFixed(6);
            clearRoute();
            if (state.nearestMarker) {
                map.removeLayer(state.nearestMarker);
                state.nearestMarker = null;
            }
            setStatus('Da cap nhat vi tri tu keo marker.');
        });
    }

    function setOrigin(lat, lon, sourceText) {
        if (!validateCoordinate(lat, lon)) {
            setStatus('Toa do khong hop le. Lat trong [-90..90], Lon trong [-180..180].');
            return false;
        }

        state.origin = { lat, lon };
        state.nearest = null;

        if (state.originMarker) {
            map.removeLayer(state.originMarker);
        }
        state.originMarker = L.marker([lat, lon], { draggable: true }).addTo(map).bindPopup('Vi tri cua ban').openPopup();
        bindOriginDrag(state.originMarker);

        originLatEl.value = lat;
        originLonEl.value = lon;

        clearRoute();
        if (state.nearestMarker) {
            map.removeLayer(state.nearestMarker);
            state.nearestMarker = null;
        }

        map.setView([lat, lon], 15);
        setStatus(`${sourceText}. Ban co the bam "Tim bai gan nhat".`);
        return true;
    }

    async function fetchJson(url) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
            const res = await fetch(url, { signal: controller.signal });
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    }

    async function geocodeAddress(query) {
        if (!query || query.length < 3) {
            setStatus('Hay nhap dia chi day du.');
            return null;
        }
        try {
            const data = await fetchJson(`{% url 'manager_geocode_forward' %}?q=${encodeURIComponent(query)}`);
            if (!data || !data.ok) {
                setStatus((data && data.error) ? data.error : 'Khong tim thay dia chi.');
                return null;
            }
            return data;
        } catch (e) {
            setStatus('Khong the ket noi dich vu dinh vi.');
            return null;
        }
    }

    async function fetchAddressSuggestions(query) {
        if (!query || query.length < 3) {
            addressSuggestionsEl.innerHTML = '';
            return;
        }
        let results = [];
        try {
            const data = await fetchJson(`{% url 'manager_geocode_suggest' %}?q=${encodeURIComponent(query)}`);
            results = (data && data.results) || [];
        } catch (e) {
            results = [];
        }
        addressSuggestionsEl.innerHTML = '';
        results.forEach((item) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'list-group-item list-group-item-action';
            btn.textContent = item.display_name;
            btn.addEventListener('click', () => {
                originAddressEl.value = item.display_name;
                addressSuggestionsEl.innerHTML = '';
                setOrigin(parseFloat(item.lat), parseFloat(item.lon), 'Da cap nhat vi tri tu dia chi');
            });
            addressSuggestionsEl.appendChild(btn);
        });
    }

    function renderParkingList(parkings) {
        parkingListEl.innerHTML = '';
        parkings.forEach((p) => {
            const li = document.createElement('li');
            li.className = 'parking-item';
            li.innerHTML = `
                <div class="fw-bold">${p.name}</div>
                <div class="small text-muted mb-1">${p.district || ''}</div>
                <div class="small">Trong: <b>${p.available_slots}</b> / ${p.capacity}</div>
                <span class="${p.available_slots > 0 ? 'badge-ok' : 'badge-full'}">${p.available_slots > 0 ? 'Con cho' : 'Da day'}</span>
            `;
            li.addEventListener('click', () => {
                const marker = state.markers.get(p.id);
                if (marker) {
                    map.setView([p.lat, p.lng], 15);
                    marker.openPopup();
                }
                state.nearest = { lat: p.lat, lon: p.lng, name: p.name, distance_km: null };
                setStatus(`Da chon bai: ${p.name}. Bam "Chi duong den bai gan nhat" de ve duong tu vi tri cua ban.`);
            });
            parkingListEl.appendChild(li);
        });
    }

    function clearParkingMarkers() {
        availableCluster.clearLayers();
        fullCluster.clearLayers();
        state.markers.clear();
    }

    function renderMarkers(parkings) {
        parkings.forEach((p) => {
            const marker = L.marker([p.lat, p.lng], { icon: iconByAvailability(p.available_slots) });
            marker.bindPopup(`
                <b>${p.name}</b><br>
                Khu vuc: ${p.district || 'Khong ro'}<br>
                Dia chi: ${p.address || 'N/A'}<br>
                Cho trong: ${p.available_slots}/${p.capacity}
            `);
            marker.on('click', () => {
                state.nearest = { lat: p.lat, lon: p.lng, name: p.name, distance_km: null };
                setStatus(`Da chon bai: ${p.name}. Bam "Chi duong den bai gan nhat" de ve duong tu vi tri cua ban.`);
            });
            if (p.available_slots > 0) {
                availableCluster.addLayer(marker);
            } else {
                fullCluster.addLayer(marker);
            }
            state.markers.set(p.id, marker);
        });
    }

    async function loadParkings() {
        setStatus('Dang tai du lieu bai do xe...');
        try {
            const res = await fetch("{% url 'parking_map_data' %}");
            if (!res.ok) throw new Error('Khong tai duoc du lieu bai do');
            const data = await res.json();

            state.parkings = data;
            clearParkingMarkers();
            renderMarkers(data);
            renderParkingList(data);

            if (data.length > 0) {
                const bounds = L.latLngBounds(data.map(p => [p.lat, p.lng]));
                map.fitBounds(bounds, { padding: [30, 30] });
            }
            setStatus(`Da tai ${data.length} bai do xe.`);
        } catch (err) {
            setStatus('Loi tai du lieu ban do: ' + err.message);
        }
    }

    function applyCoordinateInput() {
        const lat = parseFloat(originLatEl.value);
        const lon = parseFloat(originLonEl.value);
        if (!setOrigin(lat, lon, 'Da cap nhat vi tri tu toa do nhap tay')) return;
    }

    async function applyAddressInput() {
        const query = originAddressEl.value.trim();
        const result = await geocodeAddress(query);
        if (!result) return;
        originAddressEl.value = result.display_name || query;
        setOrigin(parseFloat(result.lat), parseFloat(result.lon), 'Da cap nhat vi tri tu dia chi');
        if (result.approximate) {
            setStatus('Khong tim thay so nha, dang dinh vi gan dung theo ten duong.');
        }
    }

    function locateUser() {
        if (!navigator.geolocation) {
            setStatus('Trinh duyet khong ho tro dinh vi.');
            return;
        }

        setStatus('Dang lay vi tri hien tai...');
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            setOrigin(lat, lon, 'Da cap nhat vi tri hien tai');
        }, () => {
            setStatus('Khong lay duoc vi tri hien tai. Ban co the nhap toa do thu cong.');
        }, { enableHighAccuracy: true, timeout: 10000 });
    }

    async function findNearest() {
        if (!state.origin) {
            setStatus('Hay nhap toa do va bam "Dong y toa do" truoc.');
            return;
        }

        setStatus('Dang tim bai do gan nhat con cho...');
        try {
            const url = `{% url 'api_find_nearest_parking' %}?lat=${state.origin.lat}&lon=${state.origin.lon}`;
            const res = await fetch(url);
            const data = await res.json();

            if (!res.ok || data.error || data.message || !data.lat || !data.lon) {
                setStatus(data.error || data.message || 'Khong tim duoc bai do phu hop.');
                return;
            }

            state.nearest = data;

            if (state.nearestMarker) map.removeLayer(state.nearestMarker);
            state.nearestMarker = L.circleMarker([data.lat, data.lon], {
                radius: 11,
                color: '#f59e0b',
                weight: 3,
                fillColor: '#f59e0b',
                fillOpacity: 0.3,
            }).addTo(map).bindPopup(`<b>Gan nhat: ${data.name}</b><br>Khoang cach: ${data.distance_km} km`).openPopup();

            map.setView([data.lat, data.lon], 15);
            clearRoute();
            setStatus(`Da tim thay bai gan nhat: ${data.name} (${data.distance_km} km). Bam "Chi duong den bai gan nhat" de ve lo trinh.`);
        } catch (err) {
            setStatus('Loi tim bai gan nhat: ' + err.message);
        }
    }

    async function drawRouteToNearest() {
        if (!state.origin) {
            setStatus('Hay nhap toa do diem di truoc.');
            return;
        }

        if (!state.nearest) {
            setStatus('Hay bam "Tim bai gan nhat" truoc khi chi duong.');
            return;
        }

        clearRoute();
        setStatus('Dang tinh lo trinh ngan nhat tren mang duong thuc te...');

        try {
            const url = `{% url 'api_route' %}?start_lat=${state.origin.lat}&start_lon=${state.origin.lon}&end_lat=${state.nearest.lat}&end_lon=${state.nearest.lon}`;
            const res = await fetch(url);
            const data = await res.json();

            if (!res.ok || data.error || data.type !== 'LineString') {
                setStatus(data.error || 'Khong ve duoc duong di.');
                return;
            }

            const routeCoords = data.coordinates.map((c) => [c[1], c[0]]);
            state.routeLine = L.polyline(routeCoords, { color: '#2563eb', weight: 5, opacity: 0.85 }).addTo(routeLayer);
            map.fitBounds(state.routeLine.getBounds(), { padding: [35, 35] });
            setStatus(`Da ve lo trinh ngan nhat den ${state.nearest.name}.`);
        } catch (err) {
            setStatus('Loi ve duong di: ' + err.message);
        }
    }

    function resetMap() {
        clearRoute();

        if (state.nearestMarker) {
            map.removeLayer(state.nearestMarker);
            state.nearestMarker = null;
        }
        if (state.originMarker) {
            map.removeLayer(state.originMarker);
            state.originMarker = null;
        }

        state.origin = null;
        state.nearest = null;
        originLatEl.value = '';
        originLonEl.value = '';
        originAddressEl.value = '';
        addressSuggestionsEl.innerHTML = '';

        map.setView([defaultView.lat, defaultView.lng], defaultView.zoom);
        setStatus('Da dat lai ban do.');
    }

    document.getElementById('btnApplyCoord').addEventListener('click', applyCoordinateInput);
    document.getElementById('btnLocate').addEventListener('click', locateUser);
    document.getElementById('btnNearest').addEventListener('click', findNearest);
    document.getElementById('btnRouteNearest').addEventListener('click', drawRouteToNearest);
    document.getElementById('btnReset').addEventListener('click', resetMap);
    btnGeocodeAddress.addEventListener('click', applyAddressInput);
    btnClearAddress.addEventListener('click', () => {
        originAddressEl.value = '';
        addressSuggestionsEl.innerHTML = '';
    });

    originAddressEl.addEventListener('input', (e) => {
        if (suggestionTimer) window.clearTimeout(suggestionTimer);
        suggestionTimer = window.setTimeout(() => {
            fetchAddressSuggestions(e.target.value);
        }, 300);
    });

    originAddressEl.addEventListener('blur', () => {
        setTimeout(() => { addressSuggestionsEl.innerHTML = ''; }, 200);
    });

    map.on('click', async (e) => {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        setOrigin(lat, lon, 'Da cap nhat vi tri tu ban do');
        try {
            const data = await fetchJson(`{% url 'manager_geocode_reverse' %}?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`);
            if (data && data.display_name) {
                originAddressEl.value = data.display_name;
            }
        } catch (e) {
            // ignore reverse errors
        }
    });

    loadParkings();
</script>
{% endblock %}
