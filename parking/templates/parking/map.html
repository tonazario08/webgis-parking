{% extends 'parking/base.html' %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-dark">
        <i class="fas fa-globe-asia text-primary me-2"></i>Bản đồ số Việt Nam
    </h3>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left me-1"></i> Quay lại Dashboard
    </a>
</div>

<!-- NÚT CHỨC NĂNG -->
<div class="mb-2">
    <button id="btn-find" class="btn btn-primary me-2">
        🔍 Tìm bãi đỗ gần nhất
    </button>

    <button id="btn-route" class="btn btn-success" disabled>
        🧭 Chỉ đường
    </button>
</div>

<!-- BẢN ĐỒ -->
<div class="card card-custom p-2 bg-white shadow-sm">
    <div id="map" style="height: 75vh; width: 100%; border-radius: 8px;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // ===== 1. Khởi tạo bản đồ =====
    var map = L.map('map').setView([16.0, 106.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ===== 2. Group marker để fitBounds =====
    var markers = L.featureGroup().addTo(map);

    // ===== 3. Marker khu vực (render từ Django) =====
    {% for area in areas %}
        {% if area.latitude and area.longitude %}
            L.marker([{{ area.latitude }}, {{ area.longitude }}])
                .addTo(markers)
                .bindPopup(`
                    <b>{{ area.name }}</b><br>
                    {{ area.description|default:"Không có mô tả" }}
                `);
        {% endif %}
    {% endfor %}

    if (markers.getLayers().length > 0) {
        map.fitBounds(markers.getBounds(), { padding: [50, 50] });
    }

    // ===== 4. Vị trí người dùng (tạm thời) =====
    let userLat = 10.7769;
    let userLon = 106.7009;

    L.marker([userLat, userLon])
        .addTo(map)
        .bindPopup("📍 Vị trí của bạn")
        .openPopup();

    let nearestParking = null;
    let routeLine = null;

    // ===== 5. Tìm bãi đỗ gần nhất =====
    document.getElementById("btn-find").onclick = function () {
        fetch(`/api/nearest-parking/?lat=${userLat}&lon=${userLon}`)
            .then(res => res.json())
            .then(data => {
                if (data.error || data.message) {
                    alert(data.message || data.error);
                    return;
                }

                nearestParking = data;

                L.marker([data.latitude, data.longitude])
                    .addTo(map)
                    .bindPopup(
                        `<b>${data.name}</b><br>
                         Khoảng cách: ${data.distance_km} km<br>
                         Còn trống: ${data.available_slots}`
                    )
                    .openPopup();

                document.getElementById("btn-route").disabled = false;
            });
    };

    // ===== 6. Chỉ đường =====
    document.getElementById("btn-route").onclick = function () {
        if (!nearestParking) return;

        fetch(
            `/api/route/?start_lat=${userLat}&start_lon=${userLon}` +
            `&end_lat=${nearestParking.latitude}&end_lon=${nearestParking.longitude}`
        )
        .then(res => res.json())
        .then(geojson => {
            if (routeLine) map.removeLayer(routeLine);

            routeLine = L.geoJSON(geojson, {
                style: { color: "blue", weight: 5 }
            }).addTo(map);

            map.fitBounds(routeLine.getBounds());
        });
    };
</script>

{% endblock %}
